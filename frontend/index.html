<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC-ZIP · Minecraft 基岩版 Addon 打包工具</title>
<meta name="description" content="MC-ZIP 网页版：一键打包 .mcaddon/.mcpack/.zip，版本号自增，UUID 随机刷新。Ore UI 风格界面。">
<link id="favicon" rel="icon" type="image/png" href="assets/light/pack.png">
<link rel="stylesheet" href="css/oreui.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app-shell">

  <!-- ======================= 标题栏 ======================= -->
  <header class="ore-header">
    <img class="app-logo" src="assets/logo.png" alt="MC-ZIP logo">
    <div class="titles">
      <h1>MC-ZIP</h1>
      <p class="sub">Minecraft 基岩版 Addon 打包工具 · 一键打包 / 版本号自增 / UUID 随机刷新</p>
    </div>
    <div class="spacer"></div>
    <span class="author-note" id="themeNote">主题：自动</span>
    <div class="theme-switch" role="group" aria-label="主题">
      <button class="ore-tab" data-theme-mode="light">亮色</button>
      <button class="ore-tab" data-theme-mode="dark">暗色</button>
      <button class="ore-tab" data-theme-mode="system">自动</button>
    </div>
  </header>

  <div class="ore-sep"></div>

  <main class="app-main">

    <!-- ======================= ① 导入 Addon 文件夹 ======================= -->
    <section class="app-card">
      <div class="card-title">① 导入 Addon 文件夹</div>
      <div class="card-body">
        <div class="form-row">
          <label class="field-label" for="pathDisplay">文件夹路径</label>
          <div class="ore-field grow readonly-field">
            <input type="text" id="pathDisplay" readonly placeholder="（尚未导入）"
                   data-tooltip="浏览器安全限制：无法直接打开输入的路径，请用「浏览文件夹…」或把文件夹拖进窗口">
          </div>
          <button class="ore-btn small" id="browseBtn">浏览文件夹…</button>
          <button class="ore-btn small" id="recentBtn" data-menu-anchor>最近打开 ▾</button>
          <button class="ore-btn small" id="rescanBtn">重新扫描</button>
        </div>
        <div class="form-row hint-row">
          <span class="hint">支持选择 Addon 根目录（其下含 BP / RP 子包），也支持选择单个包目录。也可以直接把文件夹拖进窗口。</span>
          <span class="spacer"></span>
          <label class="check-row">
            <button class="ore-check" id="autoLoadToggle" role="switch" aria-checked="true" aria-label="启动时自动打开上次项目"></button>
            <span>启动时自动打开上次项目</span>
          </label>
        </div>
      </div>
    </section>

    <!-- ======================= ② 检测到的 manifest.json ======================= -->
    <section class="app-card flex-card list-card">
      <div class="card-title">② 检测到的 manifest.json</div>
      <div class="card-body grow-col">
        <div class="pack-table">
          <div class="pack-head">
            <span class="pack-cell c0">包目录</span>
            <span class="pack-cell c1">打包</span>
            <span class="pack-cell c2">类型</span>
            <span class="pack-cell c3">header.version</span>
            <span class="pack-cell c4">header.uuid</span>
            <span class="pack-cell c5">模块数</span>
            <span class="pack-cell c6">相对路径</span>
          </div>
          <div class="ore-scroll list-scroll" id="listScroll">
            <div class="scroll-content" id="packRows"></div>
            <div class="ore-track"><div class="ore-thumb"></div></div>
          </div>
        </div>
        <div class="list-summary" id="listSummary">尚未导入</div>
      </div>
    </section>

    <!-- ======================= ③ 操作 ======================= -->
    <section class="app-card">
      <div class="card-title">③ 操作</div>
      <div class="card-body">
        <div class="form-row btn-row">
          <button class="ore-btn primary" id="packBtn" disabled>打包并升级版本</button>
          <button class="ore-btn" id="uuidBtn" disabled>随机刷新 UUID</button>
          <button class="ore-btn small" id="restoreBtn" disabled>还原备份</button>
          <button class="ore-btn small" id="openOutBtn" data-tooltip="网页版无法打开系统文件夹">打开输出目录</button>
        </div>

        <div class="form-row opt-row">
          <label class="field-label">版本递增位</label>
          <button class="ore-btn small ore-dropdown" id="partDrop"><span class="dd-label"></span><span class="dd-arrow">▾</span></button>
          <label class="field-label">输出格式</label>
          <button class="ore-btn small ore-dropdown" id="modeDrop"><span class="dd-label"></span><span class="dd-arrow">▾</span></button>
          <label class="field-label">UUID 格式</label>
          <button class="ore-btn small ore-dropdown" id="uuidDrop"><span class="dd-label"></span><span class="dd-arrow">▾</span></button>
          <label class="check-row">
            <button class="ore-check" id="onlyBpRpToggle" role="switch" aria-checked="true" aria-label="只处理 BP / RP"></button>
            <span>只处理 BP / RP（打包 · 版本 · UUID）</span>
          </label>
        </div>

        <div class="form-row opt-row">
          <label class="check-row">
            <button class="ore-check" id="bumpToggle" role="switch" aria-checked="true" aria-label="打包时升级版本号"></button>
            <span>打包时升级版本号</span>
          </label>
          <label class="check-row">
            <button class="ore-check" id="bumpModulesToggle" role="switch" aria-checked="false" aria-label="同时升级 modules 内版本号"></button>
            <span>同时升级 modules 内版本号</span>
          </label>
          <label class="check-row">
            <button class="ore-check" id="uuidModulesToggle" role="switch" aria-checked="true" aria-label="刷新 modules 内 UUID"></button>
            <span>刷新 modules 内 UUID</span>
          </label>
          <label class="check-row">
            <button class="ore-check" id="backupToggle" role="switch" aria-checked="true" aria-label="修改前备份 manifest.json"></button>
            <span>修改前备份 manifest.json</span>
          </label>
        </div>

        <div class="form-row">
          <label class="field-label" for="outDisplay">输出目录</label>
          <div class="ore-field grow readonly-field">
            <input type="text" id="outDisplay" readonly value="（打包时询问保存位置）">
          </div>
          <button class="ore-btn small" id="outChangeBtn">更改…</button>
        </div>
      </div>
    </section>

    <!-- ======================= ④ 操作日志 ======================= -->
    <section class="app-card flex-card">
      <div class="card-title">④ 操作日志</div>
      <div class="card-body grow-col">
        <div class="ore-scroll log-scroll" id="logScroll">
          <div class="scroll-content log-content" id="logContent"></div>
          <div class="ore-track"><div class="ore-thumb"></div></div>
        </div>
      </div>
    </section>

  </main>

  <!-- ======================= 状态栏 ======================= -->
  <div class="ore-sep status-sep"></div>
  <footer class="status-bar">
    <span id="statusText">就绪 · 请先导入 Addon 文件夹</span>
    <span class="spacer"></span>
    <span class="foot-note">作者：幻尘 · v1.0.0 · Ore UI 网页版</span>
  </footer>
</div>

<!-- ======================= 弹窗 ======================= -->
<div class="ore-overlay" id="overlay">
  <div class="ore-popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
    <button class="ore-cross" id="popupCross" data-tooltip="关闭"></button>
    <h3 id="popupTitle">提示</h3>
    <p id="popupBody"></p>
    <pre id="popupViewer" style="display:none;"></pre>
    <div class="popup-actions">
      <button class="ore-btn small" id="popupOk">确定</button>
      <button class="ore-btn small" id="popupCancel">取消</button>
    </div>
  </div>
</div>

<div class="ore-tooltip" id="tooltip"></div>
<div id="toasts"></div>

<script src="js/core.js"></script>
<script src="js/oreui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
